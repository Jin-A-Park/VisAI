<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Pytorch Model Visualization</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <header class="d-flex justify-content-between align-items-center py-2">
    <h1>Pytorch Model Visualization</h1>
    <div class="buttons">
      <button class="cssbuttons-io" id="start_button">
        <span>Start</span>
      </button>
      <button class="cssbuttons-io" id="stop_button">
        <span>Stop</span>
      </button>
      <button class="cssbuttons-io" id="resume_button">
        <span>Resume</span>
      </button>
    </div>
  </header>

  <div class="vis-container grid-container">
    <div class="graph-frame">
      <div id="line_training_loss" class="graph-placeholder"></div>
    </div>
    <div class="graph-frame">
      <div id="bar_accuracy_by_class" class="graph-placeholder"></div>
    </div>
    <div class="graph-frame">
      <div id="heatmap_extract_weight" class="graph-placeholder"></div>
    </div>
    <div class="graph-frame">
      <div id="histogram_extract_activation" class="graph-placeholder"></div>
    </div>
    <div class="graph-frame">
      <div id="line_extract_gradient_norm" class="graph-placeholder"></div>
    </div>
  </div>

  <script src="./static/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
